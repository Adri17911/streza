services:
  web:
    build: .
    container_name: streza-web
    ports:
      - "8443:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to a strong value}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a long random value}
      APP_ENV: ${APP_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./private_uploads:/app/private_uploads
    restart: unless-stopped
