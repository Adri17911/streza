<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Přihlášení | Streza Admin</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-body">
    <form class="login-card" action="/admin/login" method="post">
      <a class="logo" href="/"><img class="logo-image" src="/static/img/logo.png" alt="Streza" /></a>
      <h1>Přihlášení</h1>
      {% if error %}<p class="admin-alert error">{{ error }}</p>{% endif %}
      <label>Uživatelské jméno <input type="text" name="username" autocomplete="username" required /></label>
      <label>Heslo <input type="password" name="password" autocomplete="current-password" required /></label>
      <button class="button primary" type="submit">Přihlásit</button>
    </form>
  </body>
</html>
